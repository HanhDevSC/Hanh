<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Chúc mừng 20/10 ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Pacifico&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    /* CSS Canvas hiệu ứng nổ pixel */
    #pixel-canvas {
      position: absolute;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

<div id="neb"><i></i></div>
<div id="hint">Chạm Vào Tinh Cầu</div>
<canvas id="rain"></canvas>
<div id="wt"></div>

<button id="wish" class="ui">✎ Gửi điều ước</button>
<button id="mail" class="ui" aria-label="Mở thư">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff9ac6" stroke-width="2" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2.5" fill="#ff5fa2" fill-opacity=".35"/>
    <path d="M3.5 7l8.5 6 8.5-6"/>
  </svg>
</button>
<button id="mus" class="ui" aria-label="Bật/tắt nhạc">♪</button>

<div id="gate" class="ov show">
  <div class="box">
    <h3>Cho Xin Ít Ảnh Trong Máy Nhá =))? </h3>
    <p>Web Do Hanh Gửi Tặng 20/10 Nè 😗</p>
    <div class="row" id="btn-row">
      <button class="b" id="no">Để sau</button>
      <button class="b m" id="yes">Đồng ý ♡</button>
    </div>
  </div>
</div>

<div id="dlg" class="ov">
  <div class="box">
    <h3>Gửi điều ước lên sao băng</h3>
    <textarea id="wi" maxlength="140" placeholder="Viết lời chúc của bạn..."></textarea>
    <div class="row">
      <button class="b" id="dc">Đóng</button>
      <button class="b m" id="dg">Bay lên ✦</button>
    </div>
  </div>
</div>

<div id="lt" class="ov">
  <button id="x" aria-label="Đóng">✕</button>
  <div class="env" id="env"><i></i><b></b></div>
  <div class="card" id="card">
    <h2>Chúc mừng 20/10 ♡</h2>
    <div class="dots">• • •</div>
    <div id="lb"></div>
    <button id="cl">Đóng thư ♡</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script>
  // Xử lý riêng cho nút "Để sau": Nổ pixel biến mất NHƯNG giữ nguyên nhạc không bị tắt
  document.addEventListener("DOMContentLoaded", () => {
    const noBtn = document.getElementById("no");
    if (noBtn) {
      // Dùng capture phase (true) để bắt sự kiện trước khi main.js kịp đọc được
      noBtn.addEventListener("click", function (e) {
        e.stopImmediatePropagation(); // Chặn đứng không cho main.js nhận sự kiện này để tắt nhạc
        e.preventDefault();
        
        const rect = noBtn.getBoundingClientRect();
        
        // Tạo canvas hiệu ứng nổ pixel
        const canvas = document.createElement("canvas");
        canvas.id = "pixel-canvas";
        canvas.width = rect.width;
        canvas.height = rect.height;
        canvas.style.left = rect.left + "px";
        canvas.style.top = rect.top + "px";
        document.body.appendChild(canvas);
        
        const ctx = canvas.getContext("2d");
        
        ctx.fillStyle = window.getComputedStyle(noBtn).backgroundColor || "#ff5fa2";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = window.getComputedStyle(noBtn).color || "#fff";
        ctx.font = window.getComputedStyle(noBtn).font;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(noBtn.innerText, canvas.width / 2, canvas.height / 2);
        
        // Ẩn nút "Để sau" đi
        noBtn.style.display = "none";
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const particles = [];
        const pixelSize = 4;
        
        for (let y = 0; y < canvas.height; y += pixelSize) {
          for (let x = 0; x < canvas.width; x += pixelSize) {
            const index = (y * canvas.width + x) * 4;
            const r = imageData.data[index];
            const g = imageData.data[index + 1];
            const b = imageData.data[index + 2];
            const a = imageData.data[index + 3];
            
            if (a > 128) {
              particles.push({
                x: x,
                y: y,
                color: `rgba(${r},${g},${b},${a/255})`,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.7) * 10 - 2,
                size: pixelSize
              });
            }
          }
        }
        
        function animatePixels() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          
          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.5;
            p.size *= 0.93;
            
            if (p.size > 0.5) {
              alive = true;
              ctx.fillStyle = p.color;
              ctx.fillRect(p.x, p.y, p.size, p.size);
            }
          });
          
          if (alive) {
            requestAnimationFrame(animatePixels);
          } else {
            canvas.remove();
          }
        }
        
        animatePixels();
      }, true); 
    }
  });
</script>
<script src="main.js"></script>

</body>
</html>
